services:
  volleymindset:
    image: node:20-alpine
    container_name: volleymindset
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./:/app
    ports:
      - "127.0.0.1:8809:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    command: node server.js
